query CurrentUser {
  currentUser {
    id
    names
    lastNames
    email
    recipes {
      id
      title
      description
      ingredients
      process
      timeCategory
      nutritionCategory
      portions
      authorId
      reviews {
        rating
      }
    }
    allergies {
      allergyTo
      userId
    }
    groups {
      id
      name
      usersId
      recipesId
      authorId
      groupRecipes {
        amountIngredients
        authorId
        description
        id
        ingredients
        nutritionCategory
        portions
        process
        reviews {
          authorId
          id
          rating
          recipeId
        }
        timeCategory
        title
        unitIngredients
      }
    }
  }
}
